#:schema https://ocx.sh/schemas/project/v1.json
# OCX project toolchain for the mirror-charm sibling repo.
#
# The FLOATING MINOR is pinned here — `:0.5` picks up 0.5.x patches on a plain
# `ocx update`, while `:0.5.0` would float only over rebuilds of 0.5.0 and could
# never reach a patch release. Never `:0`: on a 0.x project the minor is where
# breaking changes land (`lock_version` went 1→2→3 across 0.3.6/0.4.3/0.5.0).
# The concrete digests live in ocx.lock, never here.

[tools]
task = "ocx.sh/go-task/task:3.53.1"
cli = "ocx.sh/ocx/cli:0.6"
mirror = "ocx.sh/ocx/mirror:0.6"

[group.lint.tools]
uv = "ocx.sh/astral-sh/uv:0.13.0"
grim = "ocx.sh/grimoire/cli:0.14.3"
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"
gitleaks = "ocx.sh/gitleaks/gitleaks:8.30.1"
prek = "ocx.sh/prek/prek:0.5.5"

[group.release.tools]
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.2"
